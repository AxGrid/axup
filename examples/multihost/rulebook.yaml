name: multihost-demo

vars:
  env: unknown   # default; overridden per-host via inventory.yaml
  node: unknown
  target: /opt/multihost-default.txt

bootstrap:
  - name: write per-host note
    template:
      src: templates/note.tmpl
      dst: "{{ .target }}"
      mode: "0644"

  # Per-environment file picked by the host's inventory var: prod hosts get
  # files/env.prod, stage hosts get files/env.stage.
  - name: install per-env config
    copy:
      src: "files/env.{{ .env }}"
      dst: "/opt/multihost-env-{{ .env }}.conf"
      mode: "0644"

  - name: announce
    command: 'echo "{{ .env }}/{{ .node }} wrote {{ .target }}"'
    when_changed:
      - "{{ .target }}"
