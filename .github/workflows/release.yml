name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so `git describe --tags --dirty` works

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          check-latest: true

      - name: Build release artifacts
        run: make release-archives

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/axup-*.tar.gz
            dist/axup-darwin-amd64
            dist/axup-darwin-arm64
            dist/axup-linux-amd64
            dist/axup-linux-arm64
            dist/SHA256SUMS
          generate_release_notes: true
